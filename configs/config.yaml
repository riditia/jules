# Trading Strategy Parameters
strategy:
  name: "basic"
  ema_short_period: 7
  ema_long_period: 26
  adx_period: 14
  adx_threshold: 25
  adx_fall_period: 3
  rsi_period: 14
  vwap_period: 14

# Risk Management
risk_management:
  capital_allocation_per_trade: 0.20  # 20%
  max_open_positions: 3

# Backtesting Parameters
backtest:
  days_of_data: 365
  interval: 60

