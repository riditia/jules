# Enhanced Trading Bot Configuration
# Strategy Configuration
strategy:
  # EMA Settings
  ema_short_period: 9
  ema_long_period: 21
  
  # ADX Settings
  adx_period: 14
  adx_threshold: 25
  adx_fall_period: 3
  
  # RSI Settings
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  
  # VWAP Settings
  vwap_period: 20

# Risk Management Configuration
risk_management:
  # Position Limits
  max_open_positions: 5
  max_position_size_percent: 20  # % of total portfolio per position
  
  # Capital Allocation
  capital_allocation_per_trade: 0.1  # 10% of available capital per trade
  max_daily_loss_percent: 5  # Stop trading if daily loss exceeds 5%
  
  # Stop Loss and Take Profit
  stop_loss_percent: 3  # 3% stop loss
  take_profit_percent: 6  # 6% take profit
  trailing_stop_percent: 2  # 2% trailing stop

# Trading Configuration
trading:
  # Market Hours (24-hour format)
  market_start_time: "09:15"
  market_end_time: "15:30"
  
  # Trading Days (0=Monday, 6=Sunday)
  trading_days: [0, 1, 2, 3, 4]  # Monday to Friday
  
  # Order Configuration
  default_order_type: "MARKET"
  default_product_type: "MTF"
  
  # Slippage and Timing
  max_slippage_percent: 0.5
  order_timeout_seconds: 30

# Symbols to Trade
symbols:
  - "NIFTY 50"
  - "RELIANCE"
  - "TCS"
  - "HDFCBANK"
  - "INFY"

# Logging Configuration
logging:
  level: "INFO"
  max_log_files: 30
  log_rotation: "daily"

# API Configuration
api:
  # Rate limiting buffer (percentage of actual limits)
  rate_limit_buffer: 0.8  # Use 80% of rate limits for safety
  
  # Retry Configuration
  max_retries: 3
  retry_delay: 1
  retry_backoff: 2
  
  # Circuit Breaker
  circuit_breaker_threshold: 5
  circuit_breaker_timeout: 60

# Backtesting Configuration (for future use)
backtesting:
  start_date: "2023-01-01"
  end_date: "2023-12-31"
  initial_capital: 100000
  commission_per_trade: 20

# Notifications (for future implementation)
notifications:
  enabled: false
  email:
    enabled: false
    smtp_server: ""
    port: 587
    username: ""
    password: ""
  
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""

# Performance Monitoring
monitoring:
  performance_tracking: true
  daily_reports: true
  position_monitoring: true
  risk_monitoring: true